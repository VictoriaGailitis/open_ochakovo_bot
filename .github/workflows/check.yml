name: Verify miniapp and Django admin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ochakovo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d ochakovo_ci'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ochakovo_ci
      SECRET_KEY: ci-only-not-a-runtime-secret-000000000000000000000000000000000000
      DEV_AUTH: '0'
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: npm test
      - run: npm run build
