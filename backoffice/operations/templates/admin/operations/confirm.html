{% extends "admin/base_site.html" %}
{% block content %}
<div class="max-w-3xl p-6 border rounded-default bg-white dark:bg-base-900">
  <h1 class="text-xl font-semibold mb-4">{{ title }}</h1>
  <p class="mb-4">{{ description }}</p><p class="mb-4">ID: {{ object_id }}</p>
  <form method="post">{% csrf_token %}
    <button class="bg-primary-600 text-white px-4 py-2 rounded-default" type="submit">Подтвердить</button>
  </form>
</div>
{% endblock %}
